services:
  - type: web
    name: fastapi-neon-app
    runtime: python
    repo: https://github.com/llit22303-spec/Booking-App  # Replace with your repo
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
