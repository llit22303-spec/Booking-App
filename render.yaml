services:
  - type: web
    name: fastapi-neon-app
    repo: https://github.com/llit22303-spec/Booking-App
    branch: main
    env: python

    plan: free
    region: singapore

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: uvicorn Server:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: PYTHONUNBUFFERED
        value: "1"

    healthCheckPath: /health
    autoDeploy: true
